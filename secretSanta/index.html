<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
    <title>Burtai</title>
</head>

<body>
    <div class="buttonContainer">
        <img class="image" src="snowflake.svg">
        <h1>Kal<span class="reset">ė</span>diniai burtai</h1>
        <form action="" class="formContainer">
            <input class="input" type="text" placeholder="Įveskite vardą">
            <p class="text">Vardas turi būti iš didžiosios ir su lietuviškom raidėm.</p>
            <button class="btn">OK</button>
            <h2 class="result"></h2>
        </form>
        <div class="envelope" id="envelope" open="false">
            <div class="flap"></div>
            <div class="sheet"><h1 class="card" id="sheet">Sheet</h1></div>
            <div class="letter"></div>
            <button class="button" id="button" >Open</button>
        </div>
    </div>
</body>

</html>
